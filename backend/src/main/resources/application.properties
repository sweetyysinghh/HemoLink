spring.application.name=hemolink-backend
server.port=${SERVER_PORT:8080}
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hemolink}
spring.datasource.username=${DB_USERNAME:hemolink}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-ttl=PT15M
security.jwt.refresh-token-ttl=P30D
auth.refresh-cookie-secure=${AUTH_COOKIE_SECURE:false}
auth.password-reset-ttl=PT30M

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

logging.level.root=INFO
logging.level.com.hemolink=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
